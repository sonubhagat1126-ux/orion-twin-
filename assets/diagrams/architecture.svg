<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f4f7"/>
      <stop offset="100%" stop-color="#e4e8ef"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1f2e">NexusTwin — Architecture Overview</text>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#7b8799">Conceptual Architecture · Not Implementation Detail</text>

  <!-- Data Layer -->
  <rect x="40" y="90" width="220" height="160" rx="8" fill="#fff" stroke="#dde1e7" filter="url(#shadow)"/>
  <rect x="40" y="90" width="220" height="32" rx="8" fill="url(#cyanGrad)"/>
  <text x="150" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">DATA LAYER</text>
  <text x="60" y="148" font-size="11" fill="#4a5568">• UCI AI4I 2020 Dataset</text>
  <text x="60" y="168" font-size="11" fill="#4a5568">• 10,000 records, 14 columns</text>
  <text x="60" y="188" font-size="11" fill="#4a5568">• 5 failure modes</text>
  <text x="60" y="208" font-size="11" fill="#4a5568">• 6 sensor types per machine</text>
  <text x="60" y="228" font-size="11" fill="#4a5568">• Statistical failure profiles</text>

  <!-- Visualization Layer -->
  <rect x="290" y="90" width="220" height="160" rx="8" fill="#fff" stroke="#dde1e7" filter="url(#shadow)"/>
  <rect x="290" y="90" width="220" height="32" rx="8" fill="url(#cyanGrad)"/>
  <text x="400" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">VISUALIZATION</text>
  <text x="310" y="148" font-size="11" fill="#4a5568">• 3D Manufacturing Floor</text>
  <text x="310" y="168" font-size="11" fill="#4a5568">• Procedural CNC Machines</text>
  <text x="310" y="188" font-size="11" fill="#4a5568">• Status Rings & Particles</text>
  <text x="310" y="208" font-size="11" fill="#4a5568">• Failure Distribution Charts</text>
  <text x="310" y="228" font-size="11" fill="#4a5568">• Sensor Trend Line Charts</text>

  <!-- Interaction Layer -->
  <rect x="540" y="90" width="220" height="160" rx="8" fill="#fff" stroke="#dde1e7" filter="url(#shadow)"/>
  <rect x="540" y="90" width="220" height="32" rx="8" fill="url(#cyanGrad)"/>
  <text x="650" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">INTERACTION</text>
  <text x="560" y="148" font-size="11" fill="#4a5568">• Orbit & Pan Controls</text>
  <text x="560" y="168" font-size="11" fill="#4a5568">• Click-to-Inspect Machines</text>
  <text x="560" y="188" font-size="11" fill="#4a5568">• WebXR VR Mode</text>
  <text x="560" y="208" font-size="11" fill="#4a5568">• WASD Walk Mode</text>
  <text x="560" y="228" font-size="11" fill="#4a5568">• Teleport Locomotion</text>

  <!-- Arrows between layers -->
  <line x1="260" y1="170" x2="290" y2="170" stroke="#c8cdd5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="170" x2="540" y2="170" stroke="#c8cdd5" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c8cdd5"/></marker></defs>

  <!-- AI/ML Engine -->
  <rect x="40" y="280" width="720" height="60" rx="8" fill="#fff" stroke="#dde1e7" filter="url(#shadow)"/>
  <rect x="40" y="280" width="180" height="60" rx="8" fill="#8b5cf6"/>
  <text x="130" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">AI / ML ENGINE</text>
  <text x="240" y="306" font-size="11" fill="#4a5568">Failure risk scoring per machine · Sensor threshold monitoring · Degradation pattern matching</text>
  <text x="240" y="324" font-size="11" fill="#4a5568">Statistical failure profiles from real data · Alert generation · Extensible ML model interface</text>

  <!-- Deployment -->
  <rect x="40" y="370" width="720" height="50" rx="8" fill="#fff" stroke="#dde1e7" filter="url(#shadow)"/>
  <rect x="40" y="370" width="180" height="50" rx="8" fill="#10b981"/>
  <text x="130" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">DEPLOYMENT</text>
  <text x="240" y="400" font-size="11" fill="#4a5568">Single HTML file · CDN-hosted dependencies (Three.js + Chart.js) · Static hosting (GitHub Pages, Netlify, S3)</text>

  <!-- Output arrow -->
  <rect x="280" y="445" width="240" height="32" rx="16" fill="url(#cyanGrad)"/>
  <text x="400" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Interactive Digital Twin Platform</text>
</svg>
