<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Logo area -->
  <circle cx="80" cy="80" r="30" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
  <circle cx="80" cy="80" r="10" fill="url(#accentGrad)"/>
  <text x="130" y="90" font-size="28" font-weight="800" fill="#fff">Nexus<span fill="url(#accentGrad)">Twin</span></text>

  <!-- Main title -->
  <text x="600" y="240" text-anchor="middle" font-size="48" font-weight="800" fill="#fff" letter-spacing="-1">Industrial Digital Twin Platform</text>
  <text x="600" y="290" text-anchor="middle" font-size="20" fill="#94a3b8">Real Data · 3D Visualization · AI Predictions · VR Ready</text>

  <!-- Feature pills -->
  <rect x="180" y="340" width="180" height="40" rx="20" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1"/>
  <text x="270" y="365" text-anchor="middle" font-size="13" fill="#0ec9c9">Predictive Maintenance</text>

  <rect x="380" y="340" width="180" height="40" rx="20" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1"/>
  <text x="470" y="365" text-anchor="middle" font-size="13" fill="#4da6ff">3D Digital Twin</text>

  <rect x="580" y="340" width="180" height="40" rx="20" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="670" y="365" text-anchor="middle" font-size="13" fill="#a78bfa">AI-Powered Analytics</text>

  <rect x="780" y="340" width="180" height="40" rx="20" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="870" y="365" text-anchor="middle" font-size="13" fill="#22d686">WebXR VR Ready</text>

  <!-- Stats -->
  <text x="600" y="430" text-anchor="middle" font-size="16" fill="#64748b">Powered by UCI AI4I 2020 Dataset · 10,000 Real Manufacturing Records · 5 Failure Modes</text>

  <!-- Footer -->
  <line x1="200" y1="480" x2="1000" y2="480" stroke="#334155" stroke-width="1"/>
  <text x="600" y="520" text-anchor="middle" font-size="14" fill="#64748b">Built with NebulaCloud Studio</text>
  <text x="600" y="545" text-anchor="middle" font-size="12" fill="#475569">nebulacloud.studio</text>
</svg>
